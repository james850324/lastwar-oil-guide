ear-gradient(180deg,var(--panel),#0d1928);box-shadow:0 8px 22px #0003}.section h2{margin:0 0 14px;font-size:24px}.section h3{margin:20px 0 8px;color:#cfe7ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.tag{display:inline-block;margin-right:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800}.p0{background:#4a1820;color:#ffb8bf}.p1{background:#173458;color:#b9dcff}.p2{background:#173d32;color:#baf5dc}.timeline{counter-reset:s}.step{position:relative;margin:0 0 11px;padding:15px 15px 15px 56px;border:1px solid var(--line);border-radius:14px;background:#132238}.step:before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:#07111f;font-weight:900}.chain{display:flex;gap:8px;overflow:auto;padding:8px 0}.node{min-width:150px;padding:12px;border-radius:12px;border:1px solid #3b5878;background:#142840;text-align:center;font-weight:800}.arrow{align-self:center;color:var(--gold);font-size:22px}.check{display:grid;gap:8px}.check label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:#132238;border:1px solid var(--line)}.check input{margin-top:5px;accent-color:var(--cyan);width:18px;height:18px}.check label:has(input:checked){opacity:.58;text-decoration:line-through}.warn,.tip{padding:12px;border-radius:10px}.warn{border-left:4px solid var(--red);background:#2d1820}.tip{border-left:4px solid var(--cyan);background:#112b2d}.small{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{border:0;border-radius:10px;padding:9px 12px;background:#264868;color:#fff;font-weight:800;cursor:pointer}footer{padding:24px 8px;color:var(--muted);text-align:center}@media(max-width:700px){.wrap{padding:10px}.hero,.section{padding:1 <script>
const D={
ko:{title:'석유시대 준비 가이드 <span class="version">v1.02</span>',lead:'석유시대 오픈 준비 및 운영 가이드입니다. 핵심은 <b>유전을 건설 0순위로 운영하고, 연맹지원 대기 시간에는 뒷마당을 진행하며, 석유 연구를 따라 본부 확장까지 빠르게 진행하는 것</b>입니다.',notice:'기준: 제공된 석유시대 영상 스크립트와 Cpt Hedgehog의 <b>The Age of Oil</b> 연구 구조입니다. 유전은 항상 건설 0순위로 운영하며, 연구 조건·건물 해금·요구량은 실제 게임 화면을 최종 기준으로 확인하세요.',nav:['오픈 전','오픈 직후','테크 경로','HQ 31+','체크리스트','주의사항'],beforeTitle:'오픈 전 준비',must:'필수',timing:'타이밍',resources:'자원과 가속',resourcesList:['초기 유전 1→30레벨용 일반자원 준비','건설·연구·범용 가속 준비'],buff:'버프와 슬롯',buffList:['테크센터 30레벨·특수부대 연구 40% 이상 달성','건설·연구 슬롯 확보'],beforeTip:'<b>핵심:</b> 석유시대 오픈 전에 연구 진입 조건과 슬롯을 갖추고, 초기 유전 1→30레벨에 필요한 일반자원과 가속을 준비합니다.',dayTitle:'오픈 직후 진행',steps:[['건설장관 신청 및 적용 확인','첫 유전 건설 전에 건설장관 효과 적용 여부를 확인합니다.'],['협동연구·협동건설 사용','협동연구는 유전 해제 연구 전, 협동건설은 첫 유전 건설 전에 사용합니다.'],['석유시대 연구 트리 진입','석유시대 연구 트리를 열고 유전 해제 연구를 준비합니다.'],['유전 해제 연구 즉시 완료','유전 해제 연구를 시작하고 연맹지원을 받은 뒤 남은 시간을 가속으로 즉시 완료합니다.'],['첫 유전 건설 시작','건설장관과 협동건설 적용 상태를 확인한 뒤 첫 유전을 건설합니다.'],['일반자원 생산량 V 완료','식량 생산량 V, 강철 생산량 V, 금화 생산량 V를 완료합니다.'],['첫 유전 30레벨 및 뒷마당 정리','첫 유전을 30레벨까지 올리면서 연맹지원 대기 시간에 뒷마당을 정리합니다.'],['석유 생산량 I용 석유 확보','뒷마당을 정리하며 석유 생산량 I 연구용 석유 60K를 확보합니다.'],['석유 생산량 I 진행','확보한 석유로 석유 생산량 I 연구를 진행합니다.'],['제3 테크센터 해금 및 가동','제3 테크센터를 해금하고 세 번째 연구 슬롯을 가동합니다.'],['추가 유전 건설 및 30레벨','추가 유전 해금 즉시 건설하고 30레벨까지 올립니다.'],['드론 부품 공장 해금 및 건설','드론 부품 공장을 해금하고 건설합니다.'],['석유 생산량 III 및 본부 확장','석유 생산량 III와 본부 확장을 진행합니다.']],zero:'<b>오해 방지:</b> 0다이아는 스크립트의 핵심 규칙이나 유전 전용 기능이 아닙니다. 실제 업그레이드 버튼에 0다이아가 표시되는 경우에만 즉시 완료합니다.',researchTitle:'석유시대 테크 핵심 경로',nodes:['유전 해제','석유 생산량 I','제3 테크센터','석유 생산량 II','추가 유전','드론 부품 공장','석유 생산량 III','본부 확장'],researchNote:'핵심 목표를 요약한 경로입니다. 실제 트리에서는 자원 생산, 고속 건설, 테크 개선, 훈련·치료, 병상·수용량, 소모량 연구 등의 선행 조건이 연결됩니다.',immediate:'즉시 진행',core:'생산 기반 핵심',prereq:'선행 조건',needed:'필요 레벨까지',coreList:['유전 해제','석유 생산량 I·II·III','제3 테크센터','추가 유전','드론 부품 공장','본부 확장'],preList:['식량·강철·금화 생산량 V','고속 건설 V·테크 개선 V','집중 훈련 V·신속 치료 V','병상 증축 V·응급 수용량 I','훈련 소모량 I·치료 소모량 II'],researchTip:'<b>운영 원칙:</b> 위 경로는 핵심 목표 요약입니다. 중간 연구는 다음 목표의 선행 조건에 필요한 레벨까지만 우선 진행하며, 유전·석유 생산량·제3 테크센터처럼 장기 생산과 병렬 연구에 직결되는 항목은 이벤트 때문에 장시간 미루지 않습니다.',hqTitle:'HQ 31 이후 운영',hqCards:[['0순위','유전','유전은 다음 HQ의 필수 건물 여부와 관계없이 항상 0순위입니다. HQ 31·33·34에서 신규 유전이 해금되며, HQ 상승 직후 최소 2개 건설 슬롯을 유전에 배정해 모든 유전을 현재 HQ 레벨과 같게 맞춥니다.'],['다음 우선','연맹지원센터','HQ 31·33·35 달성 후 연맹지원센터를 각각 31·33·35레벨로 올리면 연맹지원 횟수가 1회씩 증가합니다. 유전을 0순위로 배치한 뒤, 해당 지원 증가 레벨을 빠르게 확보합니다.'],['이후','HQ 필수 건물','유전과 연맹지원센터의 지원 증가 구간을 확보한 뒤 다음 HQ 필수 건물을 진행합니다. 석유 대기 중에는 석유를 사용하지 않는 일반 건물만 남는 슬롯으로 정비합니다.'],['반복','운영 원칙','HQ 상승 → 유전 0순위 및 최소 2개 슬롯 배정 → 신규 유전은 30레벨을 거쳐 현재 HQ 레벨까지 추격 → 모든 유전을 HQ 레벨로 통일 → 연맹지원센터 31·33·35 지원 횟수 증가 확보 → 다음 HQ 필수 건물']],checkTitle:'실행 체크리스트',reset:'체크 초기화',print:'인쇄 / PDF',image:'이미지로 저장',saving:'이미지 생성 중...',groups:[['오픈 전',['테크센터 30레벨·특수부대 연구 40% 이상 달성','초기 유전 1→30레벨용 일반자원 준비','건설·연구·범용 가속 준비','건설·연구 슬롯 확보']],['오픈 직후',['건설장관 신청 및 적용 확인','협동연구·협동건설 사용','석유시대 연구 트리 진입','유전 해제 연구 시작 및 연맹지원 후 남은 시간을 가속으로 즉시 완료','첫 유전 건설 시작','식량 생산량 V, 강철 생산량 V, 금화 생산량 V 완료','첫 유전을 30레벨까지 올리면서 연맹지원 대기 시간에 뒷마당 정리','뒷마당을 정리하며 석유 생산량 I 연구용 석유 60K 확보','석유 생산량 I 진행','제3 테크센터 해금 및 가동','추가 유전 해금 즉시 건설 후 30레벨 달성','드론 부품 공장 해금 및 건설','석유 생산량 III 및 본부 확장 진행']],['HQ 상승 후',['HQ 31 신규 유전은 먼저 30레벨까지 올린 뒤 31레벨 달성','HQ 31에서 유전 3개를 모두 31레벨로 통일','HQ 33 신규 유전을 포함해 유전 4개를 모두 33레벨로 통일','HQ 34 신규 유전을 포함해 유전 5개를 모두 34레벨로 통일','HQ 35에서는 유전 5개를 모두 35레벨로 통일','가능하면 유전에 건설 슬롯 최소 2개 배정','연맹지원센터 31·33·35레벨에서 지원 횟수 1회씩 증가 확보','이후 다음 HQ 필수 건물 진행']]],notesTitle:'주의사항 및 출처',notes:['자동 생성 자막은 용어·수치 오인식 가능성이 있습니다.','유전 30레벨의 기본 생산량은 시간당 석유 1,800이며 최대 생산 시간은 12시간입니다. 석유 생산량 연구 적용 시 실제 생산량은 증가하므로 저장 한도 전에 수거합니다.','연구 순서와 요구 레벨은 게임 화면과 Cpt Hedgehog 계산기의 선행 조건을 최종 기준으로 합니다.','HQ 31에서는 세 번째 유전을 먼저 30레벨까지 올린 뒤 유전 3개를 모두 31레벨로 맞춥니다. 이후에도 유전을 0순위로 운영하고, 연맹지원센터 31·33·35레벨의 지원 횟수 증가를 확보한 뒤 다음 HQ 필수 건물을 진행합니다.','버전 1.02에는 한국어·영어·스페인어·포르투갈어 전환 기능이 포함됩니다.'],footer:'Last War 석유시대 준비 가이드 v1.02 · 오픈 및 HQ 31+ 운영'},
en:{title:'Age of Oil Preparation Guide <span class="version">v1.02</span>',lead:'A practical mobile guide for Age of Oil preparation and progression. The key is to <b>treat Oil Wells as construction priority zero, clear the Backyard while waiting for alliance help, and advance the Age of Oil research path through HQ Expansion</b>.',notice:'Basis: the supplied Age of Oil video scripts and Cpt Hedgehog’s <b>The Age of Oil</b> research structure. Treat Oil Wells as construction priority zero, and use the in-game screen as the final authority for prerequisites, unlocks and costs.',nav:['Before Opening','Opening Day','Research Path','HQ 31+','Checklist','Notes'],beforeTitle:'Preparation Before Opening',must:'Required',timing:'Timing',resources:'Resources and Speed-ups',resourcesList:['Prepare standard resources for the first Oil Well from Lv.1 to Lv.30','Prepare Construction, Research and Universal Speed-ups'],buff:'Buffs and Queues',buffList:['Reach Tech Center Lv.30 and Special Forces research 40% or higher','Free construction and research queues'],beforeTip:'<b>Key point:</b> Before opening, meet the research entry requirements, free the required queues, and prepare resources and speed-ups for the first Oil Well from Lv.1 to Lv.30.',dayTitle:'Actions Immediately After Opening',steps:[['Apply for Construction Minister and confirm activation','Confirm the Construction Minister buff before starting the first Oil Well.'],['Use Cooperative Research and Cooperative Construction','Use Cooperative Research before Unlock Oil Well and Cooperative Construction before building the first Oil Well.'],['Enter the Age of Oil research tree','Open the research tree and prepare Unlock Oil Well.'],['Complete Unlock Oil Well immediately','Start the research, receive alliance help, then speed up the remaining time.'],['Start the first Oil Well','Confirm the construction buffs and build the first Oil Well.'],['Complete the three Output V technologies','Complete Food Output V, Iron Output V and Coin Output V.'],['Reach Oil Well Lv.30 while clearing the Backyard','Raise the first Oil Well to Lv.30 and clear the Backyard while waiting for alliance help.'],['Secure 60K Oil for Oil Output I','Clear the Backyard and secure 60K Oil for Oil Output I.'],['Research Oil Output I','Use the secured Oil to research Oil Output I.'],['Unlock and activate the 3rd Tech Center','Unlock the 3rd Tech Center and activate the third research queue.'],['Build the Additional Oil Well to Lv.30','Build it immediately after unlocking and raise it to Lv.30.'],['Unlock and build the Drone Parts Workshop','Unlock and build the Drone Parts Workshop.'],['Advance Oil Output III and HQ Expansion','Proceed with Oil Output III and HQ Expansion.']],zero:'<b>Clarification:</b> 0 Diamonds is neither an Oil Well-only feature nor a core script rule. Use instant completion only when the actual upgrade button displays 0 Diamonds.',researchTitle:'Core Age of Oil Research Path',nodes:['Unlock Oil Well','Oil Output I','3rd Tech Center','Oil Output II','Additional Oil Well','Drone Parts Workshop','Oil Output III','HQ Expansion'],researchNote:'This is a summary of the core targets. The actual tree also includes prerequisites for resource output, construction, research, training, healing, beds, capacity and costs.',immediate:'Do Immediately',core:'Production Foundation',prereq:'Prerequisites',needed:'Raise as Required',coreList:['Unlock Oil Well','Oil Output I·II·III','3rd Tech Center','Additional Oil Well','Drone Parts Workshop','HQ Expansion'],preList:['Food·Iron·Coin Output V','Fast Construction V·Tech Improvement V','Focused Training V·Rapid Healing V','Bed Expansion V·Emergency Capacity I','Training Cost I·Healing Cost II'],researchTip:'<b>Rule:</b> Do not delay Oil Output and unlock nodes just to wait for Arms Race or Mobilization. Follow the actual in-game prerequisites.',hqTitle:'Operations After HQ 31',hqCards:[['Priority 0','Oil Wells','Oil Wells are always priority zero, whether or not they are an HQ prerequisite. New wells unlock at HQ 31, 33 and 34. After every HQ upgrade, assign at least two queues to Oil Wells until all wells match the current HQ level.'],['Next Priority','Alliance Center','After reaching HQ 31, 33 and 35, raise the Alliance Center to Lv.31, 33 and 35 respectively. Each breakpoint adds one alliance-help count. Place Oil Wells at priority zero, then secure these help breakpoints quickly.'],['Then','HQ Prerequisite Buildings','After Oil Wells and the Alliance Center help-count breakpoint, work on the next HQ prerequisites. While waiting for Oil, use spare queues only for buildings that do not consume Oil.'],['Repeat','Operating Rule','HQ level up → Oil Wells as priority zero with at least two queues → raise each new well through Lv.30 to the current HQ level → match all wells to HQ → Alliance Center help breakpoint at 31/33/35 → next HQ prerequisites']],checkTitle:'Action Checklist',reset:'Reset Checks',print:'Print / PDF',image:'Save as Image',saving:'Creating image...',groups:[['Before Opening',['Reach Tech Center Lv.30 and Special Forces research 40% or higher','Prepare standard resources for the first Oil Well Lv.1→30','Prepare Construction, Research and Universal Speed-ups','Free construction and research queues']],['Immediately After Opening',['Apply for Construction Minister and confirm activation','Use Cooperative Research and Cooperative Construction','Enter the Age of Oil research tree','Start Unlock Oil Well, receive alliance help and speed up the remaining time','Start the first Oil Well','Complete Food Output V, Iron Output V and Coin Output V','Raise the first Oil Well to Lv.30 while clearing the Backyard during alliance-help waits','Clear the Backyard and secure 60K Oil for Oil Output I','Research Oil Output I','Unlock and activate the 3rd Tech Center','Build the Additional Oil Well immediately and raise it to Lv.30','Unlock and build the Drone Parts Workshop','Advance Oil Output III and HQ Expansion']],['After HQ Upgrade',['At HQ 31, raise the third Oil Well through Lv.30 to Lv.31','Bring all three Oil Wells to Lv.31 at HQ 31','At HQ 33, bring all four Oil Wells to Lv.33','At HQ 34, bring all five Oil Wells to Lv.34','At HQ 35, bring all five Oil Wells to Lv.35','Assign at least two construction queues to Oil Wells when possible','At Alliance Center Lv.31/33/35 gain one additional help count each','Then upgrade the next HQ prerequisites']]],notesTitle:'Notes and Sources',notes:['Auto-generated subtitles may misrecognize terms or numbers.','At Lv.30, an Oil Well has a base output of 1,800 Oil per hour and a maximum production time of 12 hours. Oil Output research raises actual output, so collect before storage reaches its limit.','Use in-game prerequisites and the Cpt Hedgehog calculator as the final authority for research order and levels.','At HQ 31, raise the third Oil Well through Lv.30 to Lv.31 and bring all three wells to Lv.31. After that, keep Oil Wells at priority zero, secure Alliance Center help increases at Lv.31/33/35, then work on the next HQ prerequisites.','Version 1.02 includes Korean, English, Spanish and Portuguese language switching.'],footer:'Last War Age of Oil Preparation Guide v1.02 · Opening and HQ 31+ Progression'},
es:{title:'Guía de preparación para la Era del Petróleo <span class="version">v1.02</span>',lead:'Guía práctica para preparar y avanzar en la Era del Petróleo desde el móvil. La clave es <b>tratar los Pozos Petrolíferos como prioridad cero de construcción, limpiar el patio mientras llega la ayuda de la alianza y avanzar hasta Expansión del CG</b>.',notice:'Base: los guiones de vídeo proporcionados y la estructura <b>The Age of Oil</b> de Cpt Hedgehog. Trata los Pozos como prioridad cero de construcción y usa la pantalla del juego como referencia final para requisitos, desbloqueos y costes.',nav:['Antes de abrir','Día de apertura','Ruta tecnológica','CG 31+','Lista','Notas'],beforeTitle:'Preparación antes de la apertura',must:'Obligatorio',timing:'Momento',resources:'Recursos y aceleradores',resourcesList:['Preparar recursos normales para el primer Pozo del nivel 1 al 30','Preparar aceleradores de Construcción, Investigación y Universales'],buff:'Bonificaciones y colas',buffList:['Alcanzar Centro Tecnológico nivel 30 y Fuerzas Especiales al 40% o más','Liberar las colas de construcción e investigación'],beforeTip:'<b>Clave:</b> Antes de abrir, cumple los requisitos, libera las colas y prepara recursos y aceleradores para el primer Pozo del nivel 1 al 30.',dayTitle:'Acciones inmediatamente después de abrir',steps:[['Solicitar Ministro de Construcción y confirmar su activación','Confirma el efecto antes de iniciar el primer Pozo.'],['Usar Investigación y Construcción Cooperativa','Usa Investigación Cooperativa antes de Desbloquear Pozo y Construcción Cooperativa antes del primer Pozo.'],['Entrar al árbol de la Era del Petróleo','Abre el árbol y prepara Desbloquear Pozo.'],['Completar Desbloquear Pozo inmediatamente','Inicia la investigación, recibe ayuda y acelera el tiempo restante.'],['Iniciar el primer Pozo','Confirma las bonificaciones y construye el primer Pozo.'],['Completar las tres tecnologías de Producción V','Completa Producción de Comida V, Hierro V y Monedas V.'],['Subir el Pozo a nivel 30 mientras limpias el patio','Sube el primer Pozo al nivel 30 y limpia el patio mientras esperas ayuda.'],['Conseguir 60K de Petróleo para Producción I','Limpia el patio y consigue 60K de Petróleo para Producción I.'],['Investigar Producción de Petróleo I','Usa el Petróleo reunido para Producción I.'],['Desbloquear y activar el 3.er Centro Tecnológico','Activa la tercera cola de investigación.'],['Construir el Pozo adicional hasta nivel 30','Constrúyelo al desbloquearlo y súbelo a nivel 30.'],['Desbloquear y construir el Taller de Piezas de Dron','Desbloquea y construye el Taller.'],['Avanzar Producción III y Expansión del CG','Avanza Producción III y Expansión del CG.']],zero:'<b>Aclaración:</b> 0 Diamantes no es una función exclusiva del Pozo ni una regla central del guion. Úsalo solo cuando el botón real muestre 0 Diamantes.',researchTitle:'Ruta central de investigación',nodes:['Desbloquear Pozo','Producción de Petróleo I','3.er Centro Tecnológico','Producción II','Pozo adicional','Taller de Piezas de Dron','Producción III','Expansión del CG'],researchNote:'Es un resumen de los objetivos centrales. El árbol real también incluye requisitos de producción, construcción, investigación, entrenamiento, curación, camas, capacidad y costes.',immediate:'Hacer ya',core:'Base de producción',prereq:'Requisitos previos',needed:'Subir según requisito',coreList:['Desbloquear Pozo','Producción de Petróleo I·II·III','3.er Centro Tecnológico','Pozo adicional','Taller de Piezas de Dron','Expansión del CG'],preList:['Producción de Comida·Hierro·Monedas V','Construcción Rápida V·Mejora Tecnológica V','Entrenamiento Intensivo V·Curación Rápida V','Ampliación de Camas V·Capacidad de Emergencia I','Coste de Entrenamiento I·Coste de Curación II'],researchTip:'<b>Regla:</b> No retrases la producción de Petróleo ni los desbloqueos solo para esperar eventos. Sigue los requisitos reales del juego.',hqTitle:'Operación después de CG 31',hqCards:[['Prioridad 0','Pozos Petrolíferos','Los Pozos son siempre prioridad cero, sean o no requisito del CG. Se desbloquean Pozos nuevos en CG 31, 33 y 34. Tras cada subida del CG, usa al menos dos colas hasta que todos los Pozos igualen el nivel actual del CG.'],['Siguiente prioridad','Centro de Alianza','Tras alcanzar CG 31, 33 y 35, sube el Centro de Alianza a nivel 31, 33 y 35 respectivamente. Cada nivel clave aumenta en uno el número de ayudas. Coloca primero los Pozos como prioridad cero y después asegura estos niveles.'],['Después','Edificios requeridos para el CG','Después de los Pozos y del nivel de ayuda del Centro de Alianza, mejora los requisitos del siguiente CG. Mientras esperas Petróleo, usa colas libres solo en edificios que no consuman Petróleo.'],['Repetir','Regla operativa','Subir CG → Pozos como prioridad cero con al menos dos colas → llevar cada Pozo nuevo desde nivel 30 hasta el nivel actual del CG → igualar todos los Pozos al CG → Centro de Alianza en 31/33/35 → requisitos del siguiente CG']],checkTitle:'Lista de ejecución',reset:'Restablecer',print:'Imprimir / PDF',image:'Guardar como imagen',saving:'Creando imagen...',groups:[['Antes de abrir',['Alcanzar Centro Tecnológico nivel 30 y Fuerzas Especiales al 40% o más','Preparar recursos normales para el primer Pozo nivel 1→30','Preparar aceleradores de Construcción, Investigación y Universales','Liberar colas de construcción e investigación']],['Inmediatamente después',['Solicitar Ministro de Construcción y confirmar su activación','Usar Investigación Cooperativa y Construcción Cooperativa','Entrar al árbol de investigación de la Era del Petróleo','Iniciar Desbloquear Pozo, recibir ayuda y acelerar el tiempo restante','Iniciar el primer Pozo','Completar Producción de Comida V, Hierro V y Monedas V','Subir el primer Pozo al nivel 30 mientras limpias el patio durante la espera de ayuda','Limpiar el patio y conseguir 60K de Petróleo para Producción I','Investigar Producción de Petróleo I','Desbloquear y activar el 3.er Centro Tecnológico','Construir el Pozo adicional y subirlo a nivel 30','Desbloquear y construir el Taller de Piezas de Dron','Avanzar Producción III y Expansión del CG']],['Después de subir el CG',['En CG 31, subir el tercer Pozo desde nivel 30 hasta nivel 31','Dejar los tres Pozos en nivel 31 al alcanzar CG 31','En CG 33, dejar los cuatro Pozos en nivel 33','En CG 34, dejar los cinco Pozos en nivel 34','En CG 35, dejar los cinco Pozos en nivel 35','Asignar al menos dos colas de construcción a Pozos cuando sea posible','En Centro de Alianza 31/33/35 obtener una ayuda adicional en cada nivel','Después mejorar los requisitos del siguiente CG']]],notesTitle:'Notas y fuentes',notes:['Los subtítulos automáticos pueden reconocer mal términos o cifras.','En nivel 30, un Pozo produce de base 1.800 de Petróleo por hora y almacena hasta 12 horas de producción. La investigación de Producción aumenta el valor real, por lo que conviene recoger antes de alcanzar el límite.','Usa los requisitos del juego y la calculadora de Cpt Hedgehog como autoridad final.','En CG 31, sube el tercer Pozo hasta nivel 31 y deja los tres Pozos en nivel 31. Después mantén los Pozos como prioridad cero, asegura los aumentos de ayuda del Centro de Alianza en niveles 31/33/35 y continúa con los requisitos del siguiente CG.','La versión 1.02 incluye cambio entre coreano, inglés, español y portugués.'],footer:'Guía de preparación para la Era del Petróleo de Last War v1.02 · Apertura y progreso de CG 31+'},pt:{title:'Guia de Preparação para a Era do Petróleo <span class="version">v1.02</span>',lead:'Guia de preparação e operação para a abertura da Era do Petróleo. O ponto principal é <b>tratar os Poços de Petróleo como prioridade zero de construção, avançar no Quintal enquanto aguarda a ajuda da aliança e seguir as pesquisas de Petróleo para liberar rapidamente a Expansão do QG</b>.',notice:'Base: os roteiros em vídeo fornecidos sobre a Era do Petróleo e a estrutura de pesquisa <b>The Age of Oil</b> do async function savePageImage(lang,d){
  const btn=document.getElementById('saveImage');
  const oldText=btn.textContent;
  btn.disabled=true;btn.textContent=d.saving;
  let stage=null,pngUrl=null;
  try{
    if(typeof window.html2canvas!=='function')throw new Error('html2canvas library could not be loaded');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const source=document.querySelector('.wrap');
    const clone=source.cloneNode(true);
    clone.classList.add('image-exporting');
    const originals=source.querySelectorAll('input[type="checkbox"]');
    clone.querySelectorAll('input[type="checkbox"]').forEach((x,i)=>{x.checked=!!(originals[i]&&originals[i].checked)});
    stage=document.createElement('div');
    stage.style.cssText='position:absolute;left:-12000px;top:0;width:430px;background:#07111f;pointer-events:none;overflow:visible;';
    stage.appendChild(clone);document.body.appendChild(stage);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const width=430,height=Math.ceil(clone.scrollHeight);
      const exportScale=1080/width;
    if(!height)throw new Error('Could not measure export content');
    if(height>30000)throw new Error('Export image is too tall: '+height+'px');
    const canvas=await window.html2canvas(clone,{backgroundColor:'#07111f',scale:exportScale,useCORS:true,allowTaint:false,logging:false,width:width,height:height,windowWidth:width,windowHeight:height,scrollX:0,scrollY:0});
    const png=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG conversion failed')),'image/png',1));
    pngUrl=URL.createObjectURL(png);
    const fileName=`lastwar_age_of_oil_guide_v1.02_${lang}.png`;
    const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(isIOS&&navigator.share&&window.File){
      const file=new File([png],fileName,{type:'image/png'});
      if(!navigator.canShare||navigator.canShare({files:[file]}))await navigator.share({files:[file],title:fileName});
      else window.open(pngUrl,'_blank');
    }else{
      const a=document.createElement('a');a.href=pngUrl;a.download=fileName;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    }
  }catch(e){
    console.error('Image export failed:',e);
    const detail=e&&e.message?e.message:String(e);
    alert(lang==='ko'?'PNG 저장에 실패했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.\n\n오류: '+detail:lang==='es'?'No se pudo guardar el PNG. Comprueba la conexión a Internet e inténtalo de nuevo.\n\nError: '+detail:lang==='pt'?'Não foi possível salvar o PNG. Verifique a conexão com a internet e tente novamente.\n\nErro: '+detail:'Failed to save the PNG. Check the internet connection and try again.\n\nError: '+detail);
  }finally{
    if(stage&&stage.parentNode)stage.remove();
    if(pngUrl)setTimeout(()=>URL.revokeObjectURL(pngUrl),60000);
    btn.disabled=false;btn.textContent=oldText;
  }
}
