벨로 맞춥니다. 이후에도 유전을 0순위로 운영하고, 연맹지원센터 31·33·35레벨의 지원 횟수 증가를 확보한 뒤 다음 HQ 필수 건물을 진행합니다.','버전 1.27에는 한국어·영어·스페인어·포르투갈어 전환 기능이 포함됩니다.'],costSummaryTitle:'건물 완성 순서 요약 (Korean)',costSummaryDesc:'',costSummaryOilWells:'유전',costSummaryLabels:{zero:'0순위',recommended:'권장',first:'1순위·필수',required:'필수',next:'HQ 건설 시작',prepare:'HQ 건설 중 준비',tech:'테크 준비'},costSummaryHighlight:"HQ 업그레이드 직후 최소 2개의 건설 슬롯을 유전에 배정해 모든 유전을 현재 HQ 레벨까지 우선적으로 올립니다.",costHq31Tech:"순록 화물차 테크가 완료되지 않았다면 완료하기 (HQ 31부터 보상이 UR 조각에서 전속무기 조각으로 변경)",costTitle:'HQ 31–35 확장 비용',costIntro:'HQ 완성 후 유전을 0순위로 올린 다음, 연맹지원센터와 다음 HQ 필수 건물을 진행하는 순서입니다. 비용과 시간은 감소 효과가 적용되지 않은 기본값입니다. HQ 완료 후 표는 다음 HQ를 준비하는 단계입니다. 병원·연병장·연맹지원센터·장벽처럼 중간 레벨이 필요한 건물은 낮은 레벨부터 순서대로 표시했습니다. 표 정렬 기준: 유전 0순위 → 연맹지원센터 지원 증가 구간 → 주력 병종센터 1순위 → 특수 필수 건물 1회차 → 테크센터 → 병영 → 특수 필수 건물 2회차 → 다음 HQ.',costAll:'전체',costStage:'단계',costHeaders:["건물", "레벨", "철", "식량", "금화", "오일", "시간"],costTimeTotal:'합계',costTimeDetails:[['신규 1개 1→31: 66d04:47:28','기존 1개 30→31: 16d18:21:15'],['기존 1개 31→32: 21d12:21:17'],['신규 1개 1→33: 114d18:16:38','기존 1개 32→33: 27d01:07:53'],['신규 1개 1→34: 146d17:03:50','기존 1개 33→34: 31d22:47:12'],['기존 1개 34→35: 37d06:35:04']],costNote:'신규 유전은 1레벨부터 목표 HQ 레벨까지, 기존 유전은 직전 HQ 레벨에서 다음 레벨까지 합산했습니다. 유전 레벨업에는 석유가 사용되지 않습니다.',costStages:['HQ 31 건설', 'HQ 31 완료 후 → HQ 32', 'HQ 32 완료 후 → HQ 33', 'HQ 33 완료 후 → HQ 34', 'HQ 34 완료 후 → HQ 35', 'HQ 35 완료 후'],costNames:{'Oil Wells': '0순위 유전 합계', 'Alliance Center': '연맹지원센터', 'Tech Center': '테크센터', 'Troop Center': '주력 병종센터', 'Barracks': '병영', 'Wall': '장벽', 'Hospital': '병원', 'Drill Ground': '연병장', 'HQ': 'HQ'},footer:'Last War 석유시대 준비 가이드 v1.27 · 오픈 및 HQ 31+ 운영'},

das. Coloca primero los Pozos como prioridad cero y después asegura estos niveles.'],['Después','Edificios requeridos para el CG','Después de los Pozos y del nivel de ayuda del Centro de Alianza, mejora los requisitos del siguiente CG. Mientras esperas Petróleo, usa colas libres solo en edificios que no consuman Petróleo.'],['Repetir','Regla operativa','Subir CG → Pozos como prioridad cero con al menos dos colas → llevar cada Pozo nuevo desde nivel 30 hasta el nivel actual del CG → igualar todos los Pozos al CG → Centro de Alianza en 31/33/35 → requisitos del siguiente CG']],checkTitle:'Lista de ejecución (Spanish)',reset:'Restablecer',print:'Imprimir / PDF',image:'Guardar como imagen',researchImage:'Guardar guía de investigación como imagen',researchSaving:'Creando imagen de la guía...',saving:'Creando imagen...',groups:[['Antes de abrir',['Alcanzar Centro Tecnológico nivel 30 y Fuerzas Especiales al 40% o más','Preparar recursos normales para el primer Pozo nivel 1→30','Preparar aceleradores de Construcción, Investigación y Universales','Liberar colas de construcción e investigación']],['Inmediatamente después de abrir la Era del Petróleo (Spanish)',["Solicitar Ministro de Construcción y confirmar su activación","Usar Investigación Cooperativa y Construcción Cooperativa","Entrar al árbol de investigación de la Era del Petróleo","Iniciar Desbloquear Pozo, recibir ayuda y acelerar el tiempo restante","Iniciar el primer Pozo","Completar Producción de Comida V, Hierro V y Monedas V","Subir el primer Pozo al nivel 30 mientras limpias el patio durante la espera de ayuda","Limpiar el patio y conseguir 60K de Petróleo para Producción I","Completar Producción de Petróleo I hasta nivel 10 con aceleradores","Completar Construcción Rápida V y Mejora Tecnológica V nivel 1","Completar el 3.er Centro Tecnológico con aceleradores","Completar Entrenamiento Intensivo V y Cura Rápida V nivel 1","Completar Producción de Petróleo II hasta nivel 10 con aceleradores","Completar Expansió async function savePageImage(lang,d){
  const btn=document.getElementById('saveImage');
  const oldText=btn.textContent;
  btn.disabled=true;btn.textContent=d.saving;
  let stage=null,pngUrl=null;
  try{
    if(typeof window.html2canvas!=='function')throw new Error('html2canvas library could not be loaded');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const source=document.querySelector('.wrap');
    const clone=source.cloneNode(true);
    clone.classList.add('image-exporting');
    const originals=source.querySelectorAll('input[type="checkbox"]');
    clone.querySelectorAll('input[type="checkbox"]').forEach((x,i)=>{x.checked=!!(originals[i]&&originals[i].checked)});
    stage=document.createElement('div');
    stage.style.cssText='position:absolute;left:-12000px;top:0;width:430px;background:#07111f;pointer-events:none;overflow:visible;';
    stage.appendChild(clone);document.body.appendChild(stage);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const width=430,height=Math.ceil(clone.scrollHeight);
      const exportScale=1080/width;
    if(!height)throw new Error('Could not measure export content');
    if(height>30000)throw new Error('Export image is too tall: '+height+'px');
    const canvas=await window.html2canvas(clone,{backgroundColor:'#07111f',scale:exportScale,useCORS:true,allowTaint:false,logging:false,width:width,height:height,windowWidth:width,windowHeight:height,scrollX:0,scrollY:0});
    const png=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG conversion failed')),'image/png',1));
    pngUrl=URL.createObjectURL(png);
    const fileName=`lastwar_age_of_oil_guide_v1.27_${lang}.png`;
    const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(isIOS&&navigator.share&&window.File){
      const file=new File([png],fileName,{type:'image/png'});
      if(!navigator.canShare||navigator.canShare({files:[file]}))await navigator.share({files:[file],title:fileName});
      else window.open(pngUrl,'_blank');
    }else{
      const a=document.createElement('a');a.href=pngUrl;a.download=fileName;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    }
  }catch(e){
    console.error('Image export failed:',e);
    const detail=e&&e.message?e.message:String(e);
    alert(lang==='ko'?'PNG 저장에 실패했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.\n\n오류: '+detail:lang==='es'?'No se pudo guardar el PNG. Comprueba la conexión a Internet e inténtalo de nuevo.\n\nError: '+detail:lang==='pt'?'Não foi possível salvar o PNG. Verifique a conexão com a internet e tente novamente.\n\nErro: '+detail:'Failed to save the PNG. Check the internet connection and try again.\n\nError: '+detail);
  }finally{
    if(stage&&stage.parentNode)stage.remove();
    if(pngUrl)setTimeout(()=>URL.revokeObjectURL(pngUrl),60000);
    btn.disabled=false;btn.textContent=oldText;
  }
}
